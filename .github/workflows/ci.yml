name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build all packages
        run: npm run build

      - name: CLI smoke tests
        run: node smoke.test.mjs
        working-directory: packages/cli

      # Exercises the shell across all four just-bash backends — pure JS, worker,
      # wasm, native. The last three load files at runtime, so they break silently
      # when the package is bundled or vendored without its assets: the module
      # still imports and the command still exists, it just fails when run. The
      # smoke tests above import source modules and cannot catch that.
      - name: Shell backend matrix
        run: node shell.test.mjs
        working-directory: packages/cli

      # The packages are what ship — fail if a manifest would publish something
      # broken (missing files field, bad exports, unresolvable entry point).
      - name: Verify publishable tarballs
        run: |
          for pkg in packages/core packages/adapters/browser packages/adapters/nodejs packages/cli; do
            echo "::group::$pkg"
            (cd "$pkg" && npm pack --dry-run)
            echo "::endgroup::"
          done
